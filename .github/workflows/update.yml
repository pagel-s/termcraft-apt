name: Update
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: termcraft-apt-update
  cancel-in-progress: false
jobs:
  update:
    uses: pagel-s/termcraft/.github/workflows/package-feeds.yml@7ca6f741bc4cdd9be0c38ba535c5df98235cfebb
    with:
      kind: apt
      source_revision: 7ca6f741bc4cdd9be0c38ba535c5df98235cfebb
    secrets:
      APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
